<body class="manager-lock">
  <main><header><p>느티나무 노래방</p><h1>월드가라오케 매니저</h1></header>
    <p id="device-status" role="status">등록한 휴대폰을 확인하고 있습니다…</p>
    <form id="unlock" hidden><label for="password">매니저 비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit">이 휴대폰 등록</button>
      <p id="unlock-status" role="status" aria-live="polite"></p>
    </form>
    <noscript>리모컨을 열려면 브라우저에서 자바스크립트를 허용해 주세요.</noscript>
