plugins { id 'com.android.application' }
android {
    namespace 'kr.neutinamu.p2'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.neutinamu.p2.directdiagnostic03'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3-link-diagnostic'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // Only catalog CSVs are included. PCAPs and registration profiles are never assets.
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('catalog-assets') } }
    lint { abortOnError true }
    testOptions { unitTests { includeAndroidResources = true } }
}
tasks.register('prepareCatalog', Copy) {
    from rootProject.projectDir.parentFile
    include 'catalog-20261018.csv', 'catalog-update-20261104.csv'
    into layout.buildDirectory.dir('catalog-assets')
}
tasks.named('preBuild').configure { dependsOn 'prepareCatalog' }
dependencies {
    implementation project(':core')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
