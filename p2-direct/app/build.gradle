plugins { id 'com.android.application' }
android {
    namespace 'kr.neutinamu.p2'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.neutinamu.p2.direct'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.9.0-room-qr'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // Only catalog CSVs are included. PCAPs and registration profiles are never assets.
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('catalog-assets'); assets.srcDir layout.buildDirectory.dir('search-assets') } }
    lint { abortOnError true }
    testOptions { unitTests { includeAndroidResources = true; all { maxHeapSize = '2g' } } }
}
tasks.register('prepareCatalog', Copy) {
    from rootProject.projectDir.parentFile
    include 'catalog-20261018.csv', 'catalog-update-20261104.csv'
    into layout.buildDirectory.dir('catalog-assets')
}
tasks.register('prepareSearch', Copy) {
    from rootProject.projectDir.parentFile
    include 'index.html', 'chosung.js', 'native-search.js', 'p2-ui.mjs', 'p2-client.mjs', 'p2.css', 'icon.svg', 'icon-192.png', 'icon-512.png'
    into layout.buildDirectory.dir('search-assets/song-search')
}
tasks.named('preBuild').configure { dependsOn 'prepareCatalog', 'prepareSearch' }
dependencies {
    implementation project(':core')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
