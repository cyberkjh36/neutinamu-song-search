name: P2 standalone device
on:
  push:
    paths: ['p2-standalone/**', '.github/workflows/p2-standalone.yml']
  pull_request:
    paths: ['p2-standalone/**', '.github/workflows/p2-standalone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test command handling
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ip2-standalone/include p2-standalone/tests/core_test.cpp -o /tmp/p2-core-test
          /tmp/p2-core-test
      - name: Install pinned build tools
        run: python -m pip install platformio==6.1.18 cryptography==45.0.7 certifi==2025.8.3
      - name: Compile ESP32 firmware
        run: pio run -d p2-standalone
      - name: Package flash images
        run: |
          mkdir -p p2-device-build
          cp p2-standalone/.pio/build/esp32dev/firmware.bin p2-device-build/
          cp p2-standalone/.pio/build/esp32dev/bootloader.bin p2-device-build/
          cp p2-standalone/.pio/build/esp32dev/partitions.bin p2-device-build/
          cp p2-standalone/README_KO.md p2-device-build/
          sha256sum p2-device-build/*.bin > p2-device-build/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P2-ESP32-EXPERIMENTAL
          path: p2-device-build
          retention-days: 30
