name: P2 direct Android trial
on:
  push:
    branches: [codex/p2-direct-native-trial]
  pull_request:
    paths:
      - 'p2-direct/**'
      - 'index.html'
      - 'chosung.js'
      - 'native-search.js'
      - 'favorites-*.js'
      - 'favorites.css'
      - 'p2-ui.mjs'
      - 'tests/**'
      - '.github/workflows/p2-direct-trial.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      # Keep the existing version while avoiding the distribution redirect's 504 errors.
      - name: Install verified Gradle 8.11.1
        run: |
          verified_gradle() {
            curl --fail --location --retry 1 --connect-timeout 20 --max-time 180 \
              --header 'Accept: application/octet-stream' "$1" --output "$RUNNER_TEMP/gradle-8.11.1-bin.zip" &&
            printf '%s  %s\n' f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6 "$RUNNER_TEMP/gradle-8.11.1-bin.zip" | sha256sum --check
          }
          verified_gradle https://api.github.com/repos/gradle/gradle-distributions/releases/assets/207876967 ||
          verified_gradle "https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip?build=$GITHUB_RUN_ID" ||
          verified_gradle "https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip?build=$GITHUB_RUN_ID"
          unzip -q "$RUNNER_TEMP/gradle-8.11.1-bin.zip" -d "$RUNNER_TEMP/p2-gradle"
          echo "$RUNNER_TEMP/p2-gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing web search and initial consonants
        run: npm ci && npm test
      - name: Test final APK room directory packaging guard
        run: python3 -m unittest discover -s p2-direct/tools -p 'test_package_release.py' -v
      - name: Test protocol, build Android trial, run lint
        run: gradle -p p2-direct :core:test :core:jar :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --no-daemon
      - name: Verify integrated phone search in Chromium
        if: always()
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          node p2-direct/tools/browser-check.cjs
          node p2-direct/tools/favorites-check.cjs
      - name: Confirm both existing catalogs are in APK
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('p2-direct/app/build/outputs/apk/debug/app-debug.apk') as z:
              assert len(z.read('assets/catalog-20261018.csv')) > 3000000
              assert len(z.read('assets/catalog-update-20261104.csv')) > 7000
              assert b'NeutiP2' in z.read('assets/song-search/native-search.js')
              assert b'Chosung' in z.read('assets/song-search/chosung.js')
              for name in ['favorites-data.js','favorites-ui.js','favorites.css']:
                  assert len(z.read('assets/song-search/'+name)) > 100
              assert b'native-search.js' in z.read('assets/song-search/index.html')
              assert not any(n.endswith(('.pcap','.pcapng','.p2profile')) for n in z.namelist())
          PY
      - name: Package public APK signing tool
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" p2-direct/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P2-Direct-Android-CI-Requires-Room-Packaging
          path: |
            p2-direct/app/build/outputs/apk/debug/app-debug.apk
            p2-direct/app/build/outputs/apk/release/app-release-unsigned.apk
            p2-direct/core/build/libs/core.jar
            p2-direct/apksigner.jar
            p2-direct/core/build/test-results/test/*.xml
            p2-direct/app/build/test-results/testDebugUnitTest/*.xml
            p2-direct/app/build/reports/lint-results-debug.html
            **/build/reports/p2-ui/*.png
          retention-days: 30
