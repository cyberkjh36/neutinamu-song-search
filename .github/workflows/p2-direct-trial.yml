name: P2 direct Android trial
on:
  push:
    branches: [codex/p2-direct-native-trial]
  pull_request:
    paths:
      - 'p2-direct/**'
      - 'index.html'
      - 'chosung.js'
      - 'native-search.js'
      - 'p2-ui.mjs'
      - 'tests/**'
      - '.github/workflows/p2-direct-trial.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing web search and initial consonants
        run: npm ci && npm test
      - name: Test protocol, build Android trial, run lint
        run: gradle -p p2-direct :core:test :core:jar :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug --no-daemon
      - name: Verify integrated phone search in Chromium
        if: always()
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          node p2-direct/tools/browser-check.cjs
      - name: Confirm both existing catalogs are in APK
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('p2-direct/app/build/outputs/apk/debug/app-debug.apk') as z:
              assert len(z.read('assets/catalog-20261018.csv')) > 3000000
              assert len(z.read('assets/catalog-update-20261104.csv')) > 7000
              assert b'NeutiP2' in z.read('assets/song-search/native-search.js')
              assert b'Chosung' in z.read('assets/song-search/chosung.js')
              assert b'native-search.js' in z.read('assets/song-search/index.html')
              assert not any(n.endswith(('.pcap','.pcapng','.p2profile')) for n in z.namelist())
          PY
      - name: Package public APK signing tool
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" p2-direct/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P2-Direct-Android-Trial
          path: |
            p2-direct/app/build/outputs/apk/debug/app-debug.apk
            p2-direct/app/build/outputs/apk/release/app-release-unsigned.apk
            p2-direct/core/build/libs/core.jar
            p2-direct/apksigner.jar
            p2-direct/core/build/test-results/test/*.xml
            p2-direct/app/build/test-results/testDebugUnitTest/*.xml
            p2-direct/app/build/reports/lint-results-debug.html
            **/build/reports/p2-ui/*.png
          retention-days: 30
