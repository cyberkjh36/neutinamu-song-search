name: Save shared karaoke favorites
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-favorites.yml'
      - 'scripts/sync-favorites.mjs'
permissions:
  contents: write
concurrency:
  group: shared-karaoke-favorites
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and save aggregate video counts
        run: node scripts/sync-favorites.mjs
      - name: Commit changed statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/favorites/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update shared karaoke favorites'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
