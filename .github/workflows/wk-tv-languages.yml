name: Check guest TV controls in eleven languages
on:
  push:
    branches: [main, 'codex/guest-tv-locales']
    paths: ['wk/**', 'wk-tests/**', 'tools/wk-tv-browser.mjs', '.github/workflows/wk-tv-languages.yml']
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test wk-tests/*.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tools/wk-tv-browser.mjs
